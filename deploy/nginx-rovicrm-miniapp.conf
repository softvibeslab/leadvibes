# ROVI CRM Telegram MiniApp domain
# Serves https://rovicrm.com.mx/miniapp/ from the preview frontend container
# and proxies /api/* to the preview backend container.

server {
    listen 80;
    listen [::]:80;
    server_name rovicrm.com.mx;

    access_log /var/log/nginx/rovicrm-miniapp-access.log;
    error_log /var/log/nginx/rovicrm-miniapp-error.log;

    client_max_body_size 200m;
    client_body_timeout 120s;
    server_tokens off;

    location = /miniapp {
        return 301 /miniapp/;
    }

    location ^~ /miniapp/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;

        # Telegram Web may frame MiniApps; do not forward the frontend default.
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org;" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    location / {
        return 302 /miniapp/;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
