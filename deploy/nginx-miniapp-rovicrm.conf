# ROVI Telegram MiniApp — dedicated subdomain
# Serves https://miniapp.rovicrm.com/ as STATIC files (no app container) and
# proxies /api/* to the existing PRODUCTION backend on 127.0.0.1:8000.
#
# This vhost adds NO new containers and opens NO new ports: it only serves the
# static MiniApp bundle from disk and reverse-proxies the API to the running
# production backend. Production frontend (3000) and backend (8000) are
# untouched; dev (3100/8100) and preview (3200/8200) are untouched.
#
# Static bundle lives at /var/www/miniapp-rovicrm (deploy script syncs it from
# frontend/public/miniapp/). certbot upgrades this server block to 443.

server {
    listen 80;
    listen [::]:80;
    server_name miniapp.rovicrm.com;

    root /var/www/miniapp-rovicrm;
    index index.html;

    access_log /var/log/nginx/miniapp-rovicrm-access.log;
    error_log /var/log/nginx/miniapp-rovicrm-error.log;

    client_max_body_size 200m;
    client_body_timeout 120s;
    server_tokens off;

    # Telegram frames MiniApps: allow embedding by Telegram, deny the rest.
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # API → production backend (existing container, not recreated).
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # ES modules must be served with the correct MIME type or imports fail.
    location ~* \.(?:js|mjs)$ {
        types { application/javascript js mjs; }
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # SPA-style fallback to the MiniApp shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
