# Docker Compose simplificado para Panel Docker de Hostinger
# Esta versión está optimizada para el panel de control de Hostinger

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: rovi-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME:-rovi_crm}
    volumes:
      - mongodb_data:/data/db
    networks:
      - rovi-network

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rovi-backend
    restart: always
    environment:
      # Database
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${DB_NAME:-rovi_crm}?authSource=admin
      DB_NAME: ${DB_NAME:-rovi_crm}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}

      # AI
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY}
      ROVI_AI_PROVIDER: ${ROVI_AI_PROVIDER:-openai}
      ROVI_AI_DEFAULT_MODEL: ${ROVI_AI_DEFAULT_MODEL:-gpt-5.5}
      ROVI_AI_BASE_URL: ${ROVI_AI_BASE_URL:-https://api.openai.com/v1}
      ROVI_AI_KEY_ENV: ${ROVI_AI_KEY_ENV:-OPENAI_API_KEY}
      ROVI_AI_API_KEY: ${ROVI_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ROVI_FALLBACK_AI_MODEL: ${ROVI_FALLBACK_AI_MODEL:-gpt-5.2}

      # OpenWA gateway (internal bridge to /docker/openwa)
      OPENWA_API_BASE_URL: ${OPENWA_API_BASE_URL:-http://openwa-api:2785/api}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_ROVI_WEBHOOK_SECRET: ${OPENWA_ROVI_WEBHOOK_SECRET:-}

      # Hermes / Telegram agent linking
      ROVI_TELEGRAM_BOT_USERNAME: ${ROVI_TELEGRAM_BOT_USERNAME:-}
      ROVI_TELEGRAM_BOT_TOKEN: ${ROVI_TELEGRAM_BOT_TOKEN:-}
      HERMES_TELEGRAM_BOT_USERNAME: ${HERMES_TELEGRAM_BOT_USERNAME:-}
      HERMES_TELEGRAM_BOT_TOKEN: ${HERMES_TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ROVI_HERMES_WEBHOOK_SECRET: ${ROVI_HERMES_WEBHOOK_SECRET:-}
      HERMES_WEBHOOK_SECRET: ${HERMES_WEBHOOK_SECRET:-}
      ROVI_HERMES_PROFILES_ROOT: ${ROVI_HERMES_PROFILES_ROOT:-/mnt/hermes-data/profiles}
      ROVI_HERMES_AGENT_BASE_URL: ${ROVI_HERMES_AGENT_BASE_URL:-http://hermes-agent:8642}
      ROVI_HERMES_WORKSPACE_BASE_URL: ${ROVI_HERMES_WORKSPACE_BASE_URL:-http://hermes-workspace:3000}
      ROVI_PUBLIC_API_BASE_URL: ${ROVI_PUBLIC_API_BASE_URL:-https://rovicrm.com/api}
      TELEGRAM_UPDATE_MODE: ${TELEGRAM_UPDATE_MODE:-webhook}
      TELEGRAM_POLLING_TIMEOUT_SECONDS: ${TELEGRAM_POLLING_TIMEOUT_SECONDS:-30}
      TELEGRAM_POLLING_PROFILES_REFRESH_SECONDS: ${TELEGRAM_POLLING_PROFILES_REFRESH_SECONDS:-60}
      ROVI_PRIMARY_BOT_ALLOWED_ROLE_SCOPES: ${ROVI_PRIMARY_BOT_ALLOWED_ROLE_SCOPES:-}
      ROVI_TEAM_BOT_FALLBACK_GLOBAL: ${ROVI_TEAM_BOT_FALLBACK_GLOBAL:-}

      # CORS - Production domain
      CORS_ORIGINS: ${CORS_ORIGINS:-http://srv1318804.hstgr.cloud,https://srv1318804.hstgr.cloud}

      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
    ports:
      - "8000:8000"
    expose:
      - "8000"
    volumes:
      - backend_uploads:/app/uploads
      - hermes_agent_data:/mnt/hermes-data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
    networks:
      - rovi-network
      - openwa-network
      - hermes-workspace-network

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rovi-frontend
    restart: always
    ports:
      - "3000:80"
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - rovi-network

volumes:
  mongodb_data:
    driver: local
  backend_uploads:
    driver: local
  hermes_agent_data:
    external: true
    name: hermes-workspace_hermes-agent-data

networks:
  rovi-network:
    driver: bridge
  openwa-network:
    external: true
  hermes-workspace-network:
    external: true
    name: hermes-workspace_default
