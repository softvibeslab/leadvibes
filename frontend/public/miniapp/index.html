<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F8FAFC" />
    <title>ROVI MiniApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400..600,0..1,0&display=block"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand"><span class="brand-dot" aria-hidden="true"></span>ROVI</div>
        <div class="topbar-user" id="topbarUser"></div>
      </header>
      <main id="view" class="view" role="main" aria-live="polite">
        <div class="boot-loading">
          <div class="skeleton sk-card"></div>
          <div class="skeleton sk-line"></div>
          <div class="skeleton sk-line short"></div>
        </div>
      </main>
      <nav id="tabbar" class="tabbar" role="tablist" aria-label="Navegación ROVI"></nav>
    </div>
    <div id="sheetRoot"></div>
    <div id="toastRoot" aria-live="assertive"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
