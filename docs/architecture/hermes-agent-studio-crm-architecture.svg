<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura Hermes, Agent Studio y ROVI CRM</title>
  <desc id="desc">Diagrama de arquitectura que muestra la relacion entre canales externos, Hermes, Agent Studio, runtime de agentes, roles y CRM de ROVI.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 42px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 20px Inter, Arial, sans-serif; fill: #475569; }
      .band-title { font: 800 18px Inter, Arial, sans-serif; fill: #0f172a; letter-spacing: .04em; }
      .box-title { font: 800 22px Inter, Arial, sans-serif; fill: #0f172a; }
      .box-sub { font: 600 15px Inter, Arial, sans-serif; fill: #475569; }
      .small { font: 500 14px Inter, Arial, sans-serif; fill: #334155; }
      .tiny { font: 500 12px Inter, Arial, sans-serif; fill: #64748b; }
      .pill-text { font: 700 13px Inter, Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 13px Inter, Arial, sans-serif; fill: #0f172a; }
      .note { font: 700 16px Inter, Arial, sans-serif; fill: #0f172a; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .panel-soft { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .channel { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.5; rx: 16; }
      .hermes { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.5; rx: 16; }
      .studio { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; rx: 16; }
      .runtime { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2.5; rx: 16; }
      .guard { fill: #fef2f2; stroke: #dc2626; stroke-width: 2.5; rx: 16; }
      .crm { fill: #f0fdfa; stroke: #0d9488; stroke-width: 2.5; rx: 16; }
      .data { fill: #faf5ff; stroke: #9333ea; stroke-width: 2.5; rx: 16; }
      .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrowSoft); stroke-dasharray: 7 7; }
      .arrow-orange { stroke: #ea580c; stroke-width: 3; fill: none; marker-end: url(#arrowOrange); }
      .arrow-green { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .arrow-red { stroke: #dc2626; stroke-width: 3; fill: none; marker-end: url(#arrowRed); }
      .shadow { filter: drop-shadow(0 12px 24px rgba(15, 23, 42, .10)); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1050"/>

  <text class="title" x="70" y="72">Arquitectura Hermes, Agent Studio y ROVI CRM</text>
  <text class="subtitle" x="72" y="108">Como se mezclan perfiles, roles, prompts, herramientas y seguridad antes de tocar datos reales del CRM.</text>

  <rect class="panel-soft" x="55" y="145" width="1490" height="825" rx="28"/>

  <text class="band-title" x="85" y="190">1. CANALES EXTERNOS</text>
  <text class="band-title" x="420" y="190">2. HERMES / VINCULACION</text>
  <text class="band-title" x="735" y="190">3. AGENT STUDIO</text>
  <text class="band-title" x="1060" y="190">4. RUNTIME ROVI</text>
  <text class="band-title" x="1290" y="190">5. CRM + DATOS</text>

  <rect class="channel shadow" x="80" y="225" width="250" height="138" rx="18"/>
  <text class="box-title" x="110" y="265">Usuario</text>
  <text class="box-sub" x="110" y="292">Broker, admin, rentas,</text>
  <text class="box-sub" x="110" y="314">growth u orquestador</text>
  <rect class="pill" x="110" y="330" width="158" height="30" rx="15"/>
  <text class="pill-text" x="127" y="350">rol + tenant + scope</text>

  <rect class="channel shadow" x="80" y="410" width="250" height="175" rx="18"/>
  <text class="box-title" x="110" y="450">Canales</text>
  <text class="small" x="110" y="482">Telegram Bot / MiniApp</text>
  <text class="small" x="110" y="508">WhatsApp OpenWA</text>
  <text class="small" x="110" y="534">Web CRM</text>
  <text class="small" x="110" y="560">Hermes Workspace</text>

  <rect class="hermes shadow" x="395" y="225" width="260" height="180" rx="18"/>
  <text class="box-title" x="425" y="265">Hermes Bridge</text>
  <text class="small" x="425" y="298">Genera profile spec</text>
  <text class="small" x="425" y="324">.env.rovi</text>
  <text class="small" x="425" y="350">rovi_user_profile.json</text>
  <text class="tiny" x="425" y="378">Identidad externa del agente</text>

  <rect class="hermes shadow" x="395" y="455" width="260" height="150" rx="18"/>
  <text class="box-title" x="425" y="495">Profile Hermes</text>
  <text class="small" x="425" y="526">profile_name</text>
  <text class="small" x="425" y="552">telegram chat/user</text>
  <text class="small" x="425" y="578">crm_api_base_url</text>

  <rect class="studio shadow" x="715" y="225" width="275" height="230" rx="18"/>
  <text class="box-title" x="745" y="265">Agent Studio</text>
  <text class="small" x="745" y="300">System prompt</text>
  <text class="small" x="745" y="326">Customer prompt</text>
  <text class="small" x="745" y="352">Instrucciones de tono</text>
  <text class="small" x="745" y="378">Skills activas</text>
  <text class="small" x="745" y="404">Tools habilitadas</text>
  <text class="tiny" x="745" y="432">Guarda en agent_studio_profiles</text>

  <rect class="studio shadow" x="715" y="505" width="275" height="150" rx="18"/>
  <text class="box-title" x="745" y="545">Settings Usuario</text>
  <text class="small" x="745" y="578">profile_id asignado</text>
  <text class="small" x="745" y="604">memoria + preferencias</text>
  <text class="small" x="745" y="630">tools por usuario</text>

  <rect class="runtime shadow" x="1050" y="225" width="260" height="205" rx="18"/>
  <text class="box-title" x="1080" y="265">Runtime Agente</text>
  <text class="small" x="1080" y="300">resolve_agent_runtime_config</text>
  <text class="small" x="1080" y="326">build_agent_messages</text>
  <text class="small" x="1080" y="352">contexto CRM seguro</text>
  <text class="small" x="1080" y="378">knowledge chunks</text>
  <text class="small" x="1080" y="404">tool calling</text>

  <rect class="guard shadow" x="1050" y="480" width="260" height="205" rx="18"/>
  <text class="box-title" x="1080" y="520">Guardrails</text>
  <text class="small" x="1080" y="555">tenant isolation</text>
  <text class="small" x="1080" y="581">role_scope</text>
  <text class="small" x="1080" y="607">allowed_crud JSON</text>
  <text class="small" x="1080" y="633">tools permitidas</text>
  <text class="tiny" x="1080" y="662">El prompt no salta permisos</text>

  <rect class="crm shadow" x="1360" y="225" width="130" height="205" rx="18"/>
  <text class="box-title" x="1388" y="265">CRM</text>
  <text class="small" x="1384" y="302">Leads</text>
  <text class="small" x="1384" y="328">Tasks</text>
  <text class="small" x="1384" y="354">Events</text>
  <text class="small" x="1384" y="380">Products</text>
  <text class="small" x="1384" y="406">Media</text>

  <rect class="data shadow" x="1360" y="480" width="130" height="205" rx="18"/>
  <text class="box-title" x="1380" y="520">Mongo</text>
  <text class="small" x="1382" y="555">profiles</text>
  <text class="small" x="1382" y="581">settings</text>
  <text class="small" x="1382" y="607">runs</text>
  <text class="small" x="1382" y="633">audit</text>
  <text class="small" x="1382" y="659">links</text>

  <rect class="panel" x="90" y="735" width="1390" height="185" rx="20"/>
  <text class="note" x="120" y="775">Como influyen los prompts</text>
  <text class="small" x="120" y="812">System prompt = identidad, mision, reglas y comportamiento profundo del agente.</text>
  <text class="small" x="120" y="842">Customer prompt = contexto del tipo de usuario, negocio, permisos esperados y modo de trabajo.</text>
  <text class="small" x="120" y="872">Instrucciones de tono = estilo de respuesta: ejecutivo, calido, breve, operativo, coach, etc.</text>
  <text class="small" x="770" y="812">Capacidad final = rol ROVI + tenant + allowed_crud + skills + tools + settings usuario.</text>
  <text class="small" x="770" y="842">Autopilot puede crear/actualizar si la tool y el backend lo permiten.</text>
  <text class="small" x="770" y="872">Eliminar, cambios masivos e irreversible requieren confirmacion humana.</text>

  <path class="arrow" d="M330 294 C360 294 365 294 395 294"/>
  <path class="arrow-green" d="M525 405 L525 455"/>
  <path class="arrow-orange" d="M655 312 C685 312 690 312 715 312"/>
  <path class="arrow-orange" d="M852 455 L852 505"/>
  <path class="arrow" d="M990 330 C1018 330 1022 330 1050 330"/>
  <path class="arrow-red" d="M1180 430 L1180 480"/>
  <path class="arrow-red" d="M1310 582 C1332 582 1338 582 1360 582"/>
  <path class="arrow" d="M1310 330 C1332 330 1338 330 1360 330"/>
  <path class="arrow-soft" d="M205 585 C205 700 520 705 760 735"/>
  <path class="arrow-soft" d="M1180 685 C1180 710 1180 720 1180 735"/>

  <text class="label" x="350" y="278">vincula</text>
  <text class="label" x="557" y="436">escribe</text>
  <text class="label" x="672" y="296">perfil</text>
  <text class="label" x="1012" y="312">config</text>
  <text class="label" x="1210" y="466">valida</text>
  <text class="label" x="1324" y="314">lee/escribe</text>
  <text class="label" x="1324" y="566">audita</text>
</svg>
