services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: rovi-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME:-rovi_crm}
    volumes:
      - mongodb_data:/data/db
      - ./mongodb-init:/docker-entrypoint-initdb.d
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    networks:
      - rovi-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rovi-backend
    restart: always
    environment:
      # Database
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${DB_NAME:-rovi_crm}?authSource=admin
      DB_NAME: ${DB_NAME:-rovi_crm}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}

      # AI
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY}
      AIFORDB_API_KEY: ${AIFORDB_API_KEY}
      ROVI_AI_PROVIDER: ${ROVI_AI_PROVIDER:-openai}
      ROVI_AI_DEFAULT_MODEL: ${ROVI_AI_DEFAULT_MODEL:-gpt-5.5}
      ROVI_AI_BASE_URL: ${ROVI_AI_BASE_URL:-https://api.openai.com/v1}
      ROVI_AI_KEY_ENV: ${ROVI_AI_KEY_ENV:-OPENAI_API_KEY}
      ROVI_AI_API_KEY: ${ROVI_AI_API_KEY:-}
      ROVI_AI_USD_TO_MXN: ${ROVI_AI_USD_TO_MXN:-18.5}
      ROVI_WORKSPACE_GRAPH_PATH: ${ROVI_WORKSPACE_GRAPH_PATH:-}
      ROVI_CONTROL_TOWER_OWNER_EMAILS: ${ROVI_CONTROL_TOWER_OWNER_EMAILS:-rgarciavital@gmail.com}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      # SendGrid
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_SENDER_EMAIL: ${SENDGRID_SENDER_EMAIL:-noreply@rovirealestate.com}
      SENDGRID_SENDER_NAME: ${SENDGRID_SENDER_NAME:-Rovi Real Estate}
    volumes:
      - backend_uploads:/app/uploads
      - ./graphify-out:/app/project-graphify-out:ro
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - rovi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_ROVI_CONTROL_TOWER_OWNER_EMAILS: ${ROVI_CONTROL_TOWER_OWNER_EMAILS:-rgarciavital@gmail.com}
    container_name: rovi-frontend
    restart: always
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rovi-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  mongodb_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  rovi-network:
    driver: bridge
