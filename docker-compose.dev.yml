services:
  # Bridge-only proxy so dev containers can reach host Ollama without exposing Ollama publicly.
  # host.docker.internal resolves to 172.17.0.1 on this VPS.
  ollama-proxy:
    image: alpine/socat:latest
    container_name: leadvibes-dev-ollama-proxy
    restart: unless-stopped
    network_mode: host
    command: ["-d", "-d", "TCP-LISTEN:11434,bind=172.17.0.1,fork,reuseaddr", "TCP:127.0.0.1:11434"]

  mongodb:
    container_name: leadvibes-dev-mongodb
    ports:
      - "${MONGO_HOST_PORT:-27027}:27017"

  backend:
    container_name: leadvibes-dev-backend
    image: leadvibes-dev-backend
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:13000,http://127.0.0.1:13000}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:18080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:13000}
    ports:
      - "${BACKEND_HOST_PORT:-18080}:8000"
    networks:
      rovi-network:
        aliases:
          - rovi-backend

  frontend:
    container_name: leadvibes-dev-frontend
    image: leadvibes-dev-frontend
    build:
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-}
        REACT_APP_ENVIRONMENT: development
    ports:
      - "${FRONTEND_HOST_PORT:-13000}:80"

volumes:
  mongodb_data:
    name: leadvibes_dev_mongodb_data
  backend_uploads:
    name: leadvibes_dev_backend_uploads

networks:
  rovi-network:
    name: leadvibes-dev-network
