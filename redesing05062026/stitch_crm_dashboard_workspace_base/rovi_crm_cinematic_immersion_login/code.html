<script>
        // Simple micro-interaction for input movement
        document.querySelectorAll('.glass-input').forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.group').querySelector('.material-symbols-outlined').style.transform = 'translateY(-50%) scale(1.1)';
            });
            input.addEventListener('blur', () => {
                input.closest('.group').querySelector('.material-symbols-outlined').style.transform = 'translateY(-50%) scale(1)';
            });
        });

        // Background parallax effect
        document.addEventListener('mousemove', (e) => {
            const amount = 20;
            const x = (e.clientX / window.innerWidth - 0.5) * amount;
            const y = (e.clientY / window.innerHeight - 0.5) * amount;
            document.querySelector('.background-image-container').style.transform = `scale(1.05) translate(${x}px, ${y}px)`;
        });
    </script>
