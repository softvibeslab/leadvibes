<script>
    // Parallax effect on mouse movement
    document.addEventListener('mousemove', (e) => {
        const moveAmount = 15;
        const x = (e.clientX / window.innerWidth - 0.5) * moveAmount;
        const y = (e.clientY / window.innerHeight - 0.5) * moveAmount;
        
        document.querySelector('.background-image-container').style.transform = `scale(1.05) translate(${x}px, ${y}px)`;
        document.querySelector('.glass-overlay-container').style.transform = `translate(${x * 1.5}px, ${y * 1.5}px)`;
        
        // Subtle card tilt
        const card = document.querySelector('.glass-card');
        const tiltX = (e.clientY / window.innerHeight - 0.5) * 5;
        const tiltY = (e.clientX / window.innerWidth - 0.5) * -5;
        card.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) translateY(0)`;
    });

    // Input focus animations
    document.querySelectorAll('.glass-input').forEach(input => {
        input.addEventListener('focus', () => {
            input.closest('.group').querySelector('.material-symbols-outlined').style.color = '#00d9ff';
        });
        input.addEventListener('blur', () => {
            input.closest('.group').querySelector('.material-symbols-outlined').style.color = '';
        });
    });
</script>
